modLoader = "javafml"
loaderVersion = "[4,)"
license = "All-Rights-Reserved"

[[mods]]
modId = "voxy"
version = "${version}"
displayName = "Voxy"
description = "Far distance rendering mod utilising LoDs"
authors = "Cortex"
logoFile = "assets/voxy/icon.png"

[mods.modproperties]
commit = "${commit}"
"sodium:config_api_user" = "me.cortex.voxy.client.config.VoxyConfigMenu"

[[mixins]]
config = "client.voxy.mixins.json"

[[mixins]]
config = "common.voxy.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.voxy]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.voxy]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.voxy]]
modId = "sodium"
type = "required"
versionRange = "[0.8.13,0.9)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.voxy]]
modId = "iris"
type = "optional"
versionRange = "[1.8,1.9)"
ordering = "NONE"
side = "CLIENT"
