plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', 'HEAD']
            ignoreExitValue = true
        }
        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>"
        }
        return result.standardOutput.asText.get().strip()
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>"
    }
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

neoForge {
    version = project.neoforge_version

    validateAccessTransformers = true

    runs {
        client {
            client()
            gameDirectory = project.file(project.findProperty("voxy.runDir") ?: "run")
            jvmArguments.addAll("-Xmx4G")
        }
    }

    mods {
        voxy {
            sourceSet sourceSets.main
        }
    }
}

def lwjglNatives = ["natives-linux", "natives-linux-arm64", "natives-windows", "natives-windows-arm64", "natives-macos", "natives-macos-arm64"]

configurations {
    // Mod jars as published. They are compiled against and copied into the dev run's mods folder.
    devMods { transitive = false }
    lwjglNativeLibs { transitive = false }
}

// The NeoForge Sodium jar is a wrapper that jar-in-jars the actual mod, javac needs the inner jar.
def extractNestedMods = tasks.register("extractNestedMods", Sync) {
    from(configurations.devMods.elements.map { it.collect { zipTree(it.asFile) } }) {
        include "META-INF/jarjar/*.jar"
        eachFile { path = name }
        includeEmptyDirs = false
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    into layout.buildDirectory.dir("nestedMods")
}

def copyDevMods = tasks.register("copyDevMods", Sync) {
    from configurations.devMods
    into project.file(project.findProperty("voxy.runDir") ?: "run").toPath().resolve("mods").toFile()
    preserve { include "**" }
}

tasks.named("prepareClientRun") { dependsOn copyDevMods }

dependencies {
    devMods "maven.modrinth:sodium:${project.sodium_version}"
    devMods "maven.modrinth:iris:${project.iris_version}"
    compileOnly "maven.modrinth:iris:${project.iris_version}"
    compileOnly files(extractNestedMods.map { it.destinationDir.listFiles().findAll { it.name.contains("sodium") || it.name.startsWith("fabric-") } }) {
        builtBy extractNestedMods
    }
    compileOnly "io.github.douira:glsl-transformer:3.0.0-pre3"
    compileOnly "org.anarres:jcpp:1.4.14"

    // Minecraft ships LWJGL core, the extra modules must use the same version
    implementation "org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}"
    implementation "org.lwjgl:lwjgl-zstd:${project.lwjgl_version}"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:${project.lwjgl_version}"
    jarJar("org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}")
    jarJar("org.lwjgl:lwjgl-zstd:${project.lwjgl_version}")
    // Every natives jar declares the same module name per library, so they cannot be jar-in-jar'd side by side.
    // Their shared libraries are copied into the voxy jar instead, see the jar task.
    for (String natives : lwjglNatives) {
        additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:${natives}"
        additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:${natives}"
        lwjglNativeLibs "org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:${natives}"
        lwjglNativeLibs "org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:${natives}"
    }

    for (String lib : [
            'redis.clients:jedis:5.1.0',
            'org.rocksdb:rocksdbjni:10.2.1',
            'org.apache.commons:commons-pool2:2.12.0',
            'org.tukaani:xz:1.10',
            'org.xerial:sqlite-jdbc:3.49.1.0',
    ]) {
        implementation lib
        additionalRuntimeClasspath lib
        jarJar(lib)
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
    it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

processResources {
    def hash = gitCommitHash()
    def props = [
            "version"          : project.version,
            "commit"           : hash,
            "minecraft_version": project.minecraft_version,
            "neoforge_version" : project.neoforge_version,
    ]
    inputs.properties(props)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(props)
    }
}

jar {
    from("LICENSE.md") {
        rename { "${it}_${project.archives_base_name}" }
    }
    manifest {
        attributes(["Voxy-Commit": gitCommitHash()])
    }
}

jar {
    // LWJGL loads these through the class loader of its own module, which can see every package in the game layer
    from(configurations.lwjglNativeLibs.elements.map { it.collect { zipTree(it.asFile) } }) {
        exclude "META-INF/**"
    }
}

// RocksDB bundles natives for every platform, only keep x86-64 Linux and Windows unless -PincludeOtherArchs=true
def includeOtherArchs = "true".equalsIgnoreCase(project.findProperty("includeOtherArchs"))
tasks.named("jarJar") {
    inputs.property("includeOtherArchs", includeOtherArchs)
    doLast {
        if (includeOtherArchs) return
        fileTree(outputDirectory).matching { include "**/rocksdbjni-*.jar" }.each { File jarFile ->
            def stripped = new File(jarFile.parentFile, jarFile.name + ".tmp")
            new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                new java.util.zip.ZipOutputStream(new FileOutputStream(stripped)).withCloseable { out ->
                    zip.entries().each { entry ->
                        def name = entry.name
                        boolean otherArch = name.endsWith(".jnilib") || (name.endsWith(".so")
                                && ["osx", "linux32", "musl", "s390x", "riscv64", "ppc64le", "aarch64"].any { name.contains(it) })
                        if (otherArch) return
                        out.putNextEntry(new java.util.zip.ZipEntry(name))
                        zip.getInputStream(entry).withCloseable { out << it }
                        out.closeEntry()
                    }
                }
            }
            jarFile.delete()
            stripped.renameTo(jarFile)
        }
    }
}
